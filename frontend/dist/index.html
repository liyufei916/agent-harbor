<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 保守 CSP：本地资源 + Wails 桥 + Vite HMR + 页面所用 Google Fonts；禁止 object/frame 嵌入 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' wails: https://wails.localhost http://wails.localhost ws: wss: http://127.0.0.1:5173 http://localhost:5173 ws://127.0.0.1:5173 ws://localhost:5173 http://127.0.0.1:18765 http://localhost:18765;"
    />
    <title>Agent Harbor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/assets/index-CaYDBOY2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D8-ex5EG.css">
  </head>
  <body>
    <div id="onboarding-root" class="onboarding-layer hidden"></div>
    <div class="shell" id="app-shell">
      <header class="titlebar" id="titlebar">
        <strong class="titlebar-brand">Agent Harbor</strong>
        <span class="titlebar-tagline">密钥留在本机 · Agent 隔离运行</span>
        <span id="mode-badge" class="badge mock hidden" hidden>模拟模式</span>
        <span id="isolation-badge" class="badge isolation-badge isolation-seatbelt" title="当前隔离后端 / Docker 引擎">Seatbelt</span>
        <button type="button" class="btn titlebar-help hidden" id="btn-restart-app" title="重启应用使隔离后端或引擎生效">重启应用</button>
        <span class="spacer"></span>
        <label class="session-switch hidden" id="session-switch-wrap">
          <span class="meta">当前会话</span>
          <select id="session-switch" aria-label="切换会话"></select>
        </label>
        <span id="perm-pending-badge" class="badge perm-pending hidden" title="有待决定的扩权请求">待扩权</span>
        <button type="button" class="btn titlebar-help" id="tutorial-btn" title="使用教程">使用教程</button>
      </header>
      <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav">
          <button type="button" class="nav-item on" data-route="home" title="HOME">
            <span class="nav-ico" aria-hidden="true">⌂</span>
            <span class="nav-label">HOME</span>
          </button>
          <button type="button" class="nav-item" data-route="models" title="模型">
            <span class="nav-ico" aria-hidden="true">◇</span>
            <span class="nav-label">模型</span>
          </button>
          <button type="button" class="nav-item" data-route="tools" title="工具">
            <span class="nav-ico" aria-hidden="true">⚒</span>
            <span class="nav-label">工具</span>
          </button>
          <button type="button" class="nav-item" data-route="records" title="记录">
            <span class="nav-ico" aria-hidden="true">☰</span>
            <span class="nav-label">记录</span>
          </button>
          <button type="button" class="nav-item" data-route="settings" title="设置">
            <span class="nav-ico" aria-hidden="true">⚙</span>
            <span class="nav-label">设置</span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <button type="button" class="btn sidebar-toggle" id="sidebar-toggle" title="收缩侧栏">«</button>
          <div class="health" id="health-light" title="隔离状态">
            <span class="health-dot" id="health-dot"></span>
            <span class="health-text" id="health-text">检测中…</span>
          </div>
        </div>
      </aside>
      <div class="main-col">
        <p class="warn-banner hidden" id="mode-banner"></p>
        <main id="view-home" class="view"></main>
        <main id="view-wizard" class="view hidden"></main>
        <main id="view-models" class="view hidden"></main>
        <main id="view-tools" class="view hidden"></main>
        <main id="view-records" class="view hidden"></main>
        <main id="view-settings" class="view hidden"></main>
        <main id="view-session" class="view hidden"></main>
        <main id="view-setup" class="view hidden" aria-hidden="true"></main>
      </div>
    </div>
    <div id="block-root" class="block-layer hidden"></div>
    <div id="modal-root" class="modal-layer hidden"></div>
  </body>
</html>
