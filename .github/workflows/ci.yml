name: CI

on:
  push:
    branches: [main]
  # 不限制目标分支：所有分支的 PR 都必须经过同一套检查。
  pull_request:

permissions:
  contents: read

jobs:
  # 格式独立：失败不跳过 race/覆盖率/打包（E1）。仍须合入前修绿。
  format:
    name: Go format
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          bad="$(gofmt -l .)"
          if [ -n "$bad" ]; then
            echo "gofmt needed:"
            echo "$bad"
            exit 1
          fi

      - name: Check repository diff
        run: git diff --check

      - name: Session limit mock ↔ Go 同源
        shell: bash
        run: |
          go_n="$(sed -n 's/^const MaxActiveSessions = \([0-9][0-9]*\).*/\1/p' internal/orchestrator/session.go | head -1)"
          js_n="$(sed -n 's/^export const MAX_ACTIVE_SESSIONS = \([0-9][0-9]*\).*/\1/p' frontend/src/session-limits.js | head -1)"
          echo "Go MaxActiveSessions=$go_n  frontend MAX_ACTIVE_SESSIONS=$js_n"
          test -n "$go_n" && test -n "$js_n" && test "$go_n" = "$js_n"

  # 前端测独立 job：失败直达，不埋在 Wails 打包步里。
  frontend:
    name: Frontend tests
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and test
        shell: bash
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend

      - name: npm audit
        shell: bash
        run: npm audit --prefix frontend --audit-level=moderate

  go:
    name: Go checks (macOS)
    needs: [frontend]
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run tests with race detector
        shell: bash
        run: set -o pipefail && go test -json -race ./... | tee gotest.json

      - name: Report and gate security-related skips (E5)
        if: always()
        run: |
          if [ -f gotest.json ]; then
            python3 scripts/ci_skip_gate.py gotest.json
          else
            echo "gotest.json missing; skip report unavailable"
            exit 1
          fi

      - name: Assert portable Seatbelt profile contracts
        run: >
          go test -race ./internal/runtime
          -run 'TestReadOnly|TestCodexProfile|TestSeatbeltProfile|TestDSH|TestEndpoint|TestCanonical|TestWithin'

      - name: Generate unit coverage
        run: |
          # 排除 build/android|ios 脚手架（若仍存在）以免 summary 充斥 0.0% 噪音
          pkgs=$(go list ./... | grep -Ev '/build/(android|ios)(/|$)')
          go test -coverprofile=coverage.out $pkgs
          go tool cover -func=coverage.out | tee coverage-summary.txt
          python3 scripts/coverage-badge.py coverage-summary.txt coverage.svg
          echo "$GITHUB_SHA" > coverage-source-sha.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-unit-coverage
          path: |
            coverage.out
            coverage-summary.txt
            coverage.svg
            coverage-source-sha.txt
          retention-days: 7

      - name: Run vet
        run: go vet ./...

      - name: Validate Wails v3 desktop build
        shell: bash
        run: |
          export GOBIN="$RUNNER_TEMP/harbor-bin"
          mkdir -p "$GOBIN"
          export PATH="$GOBIN:$PATH"
          echo "$GOBIN" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.34
          npm ci --prefix frontend
          wails3 generate bindings ./...
          wails3 build

      - name: Validate macOS application bundle
        shell: bash
        run: |
          wails3 task darwin:package
          plutil -lint bin/AgentHarbor.app/Contents/Info.plist
          test "$(plutil -extract CFBundleExecutable raw -o - bin/AgentHarbor.app/Contents/Info.plist)" = AgentHarbor
          test -x bin/AgentHarbor.app/Contents/MacOS/AgentHarbor
          codesign --verify --deep --strict bin/AgentHarbor.app
          ditto -c -k --keepParent bin/AgentHarbor.app AgentHarbor-macos.zip
          shasum -a 256 AgentHarbor-macos.zip | tee AgentHarbor-macos.zip.sha256

      - name: Upload AgentHarbor.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentHarbor-macos-${{ github.sha }}
          path: |
            AgentHarbor-macos.zip
            AgentHarbor-macos.zip.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Validate native WebView bindings and shutdown
        run: go test -tags production,harbor_desktop -run TestNativeDesktopBindingsAndShutdown -v .

  python:
    name: Security evidence checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile security helpers
        run: python -m py_compile security/checks.py security/seatbelt_probe.py security/test_checks.py security/test_sandbox_profile.py scripts/ci_skip_gate.py

      - name: Test security helpers
        run: python -m unittest discover -s security -p 'test_*.py'

      - name: Validate example report
        run: python security/checks.py security/fixtures/acceptance.example.json

  coverage-badge:
    name: Publish main coverage badge
    needs: [go, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: main-coverage-badge
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: go-unit-coverage
          path: ${{ runner.temp }}/coverage-report

      - name: Publish coverage badge
        shell: bash
        env:
          REPORT_DIR: ${{ runner.temp }}/coverage-report
        run: |
          # 较早的运行不得覆盖 main 最新提交的报告。
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main 已更新，跳过旧覆盖率报告"
            exit 0
          fi
          if [ -n "$(git ls-remote --heads origin coverage-badge)" ]; then
            git fetch origin coverage-badge
            git switch -c coverage-badge FETCH_HEAD
          else
            git switch --orphan coverage-badge
          fi
          test -f "$REPORT_DIR/coverage.svg"
          test -f "$REPORT_DIR/coverage-summary.txt"
          test -f "$REPORT_DIR/coverage-source-sha.txt"
          cp "$REPORT_DIR/coverage.svg" coverage.svg
          cp "$REPORT_DIR/coverage-summary.txt" coverage-summary.txt
          cp "$REPORT_DIR/coverage-source-sha.txt" coverage-source-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.svg coverage-summary.txt coverage-source-sha.txt
          if git diff --cached --quiet; then
            echo "覆盖率报告未变化"
            exit 0
          fi
          git commit -m "更新 main 覆盖率徽章 ($(cat coverage-source-sha.txt | cut -c1-7))"
          git push origin HEAD:coverage-badge
